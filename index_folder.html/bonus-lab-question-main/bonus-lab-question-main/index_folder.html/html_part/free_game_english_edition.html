<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Free Game - Wordle</title>
    <link rel="stylesheet" href="../css_part/style.css">
    <link rel="stylesheet" href="../css_part/memes.css">
    <link rel="stylesheet" href="../css_part/signin.css">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #ffffff; padding: 20px; }
        .back-btn { display: inline-flex; gap: 5px; text-decoration: none; color: black; margin-bottom: 20px; }
        .letter { display: flex; justify-content: center; align-items: center; width: 45px; height: 45px; background-color: #ffffff; border: 2px solid #d3d6da; border-radius: 4px; font-size: 24px; font-weight: bold; text-transform: uppercase; }
        
        .board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; max-width: 300px; margin: 0 auto 30px auto; }
        .board-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

        .correct { background-color: #6aaa64 !important; color: white !important; border-color: #6aaa64 !important; }
        .present { background-color: #c9b458 !important; color: white !important; border-color: #c9b458 !important; }
        .absent { background-color: #787c7e !important; color: white !important; border-color: #787c7e !important; }

        .message { font-size: 18px; font-weight: bold; margin-bottom: 15px; min-height: 25px; }
    </style>
</head>
<body>

    <input type="checkbox" id="modal-toggle" class="modal-checkbox">
    <label for="modal-toggle" class="signin-btn" id="signin-btn">SIGN IN</label>

    <div class="modal-overlay">
        <div class="modal-content">
            <label for="modal-toggle" class="close-modal">&times;</label>
            <h2>Авторизація</h2>
            <form>
                <label class="form-label" for="username">Логін або Email:</label>
                <input type="text" id="username" required placeholder="Введіть логін">
                
                <label class="form-label" for="password">Пароль:</label>
                <div style="position: relative; margin-bottom: 15px;">
                    <input type="password" id="password" required placeholder="Введіть пароль" style="margin-bottom: 0; padding-right: 40px; width: 100%; box-sizing: border-box;">
                    <span onclick="togglePassword()" id="eye-icon" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; user-select: none;">👁️</span>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" onclick="login(event)" style="flex: 1; margin-top: 0;">Увійти</button>
                    <button type="submit" onclick="register(event)" style="flex: 1; margin-top: 0; background-color: #dc3545 !important;">Реєстрація</button>
                </div>
            </form>
        </div>
    </div>

    <a href="free_game_edition_selector.html" class="back-btn">
        <div class="letter" style="width: 35px; height: 35px; font-size: 16px;">Н</div>
        <div class="letter" style="width: 35px; height: 35px; font-size: 16px;">А</div>
        <div class="letter" style="width: 35px; height: 35px; font-size: 16px;">З</div>
        <div class="letter" style="width: 35px; height: 35px; font-size: 16px;">А</div>
        <div class="letter" style="width: 35px; height: 35px; font-size: 16px;">Д</div>
    </a>

    <h1>English Edition (5 letters)</h1>
    <div class="message" id="game-message">Type a 5-letter English word</div>

    <div class="board" id="board"></div>

    <button onclick="resetGame()" style="padding: 10px 20px; font-weight: bold; background-color: #333333; color: white; border: none; border-radius: 5px; cursor: pointer;">New Game</button>

<script>
    window.WORDS_JSON_URL = "../data/words_en.json";
    window.ALLOWED_LETTERS_REGEX = /^[a-zA-Z]$/;
</script>
    <script src="../scripts/game_script.js"></script>
    <script src="../scripts/script.js"></script>

</body>
</html>
